# Settings for the LOCAL SonarQube (Docker, http://localhost:9000).
# SonarQube Cloud uses the sonar-project.properties file in the repo root.
sonar.projectKey=restful-udp-gateway
sonar.projectName=restful-udp-gateway (local)

sonar.sources=server
sonar.tests=server/tests
sonar.test.inclusions=server/tests/**
sonar.exclusions=server/crow_all.h,server/build/**,server/build-local/**,server/tests/**

sonar.cfamily.compile-commands=server/build-local/compile_commands.json
sonar.coverageReportPaths=coverage-local.xml
sonar.coverage.exclusions=server/tests/**

sonar.sourceEncoding=UTF-8
