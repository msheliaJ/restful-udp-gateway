# SonarQube Cloud project identity (must match the keys shown in SonarQube Cloud)
sonar.projectKey=msheliaJ_restful-udp-gateway
sonar.organization=msheliaj
sonar.projectName=restful-udp-gateway

# --- Analysis scope ---------------------------------------------------------
# Application code: the Crow REST server and its browser UI.
# client/ is a Windows-only Winsock program; it is not compiled on the Linux
# CI runner, so it has no compile command and is left out of C++ analysis.
sonar.sources=server
sonar.tests=server/tests
sonar.test.inclusions=server/tests/**

# Third-party / generated files are not our code:
#   crow_all.h   - Crow single header, downloaded at build time
#   build/       - CMake output, compile database, gcov data
sonar.exclusions=server/crow_all.h,server/build/**,server/tests/**

# --- C++ (compilation database produced by CMake) ---------------------------
sonar.cfamily.compile-commands=server/build/compile_commands.json

# --- Coverage (gcovr, SonarQube generic coverage format) ---------------------
sonar.coverageReportPaths=coverage.xml
sonar.coverage.exclusions=server/tests/**

sonar.sourceEncoding=UTF-8
